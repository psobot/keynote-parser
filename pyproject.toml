[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keynote-parser"
version = "1.13.1.0"
description = "A tool for manipulating Apple Keynote presentation files."
readme = "README.md"
authors = [{ name = "Peter Sobot", email = "github@petersobot.com" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["keynote", "macOS", "apple", "presentation", "powerpoint"]
requires-python = ">=3.9"
dependencies = [
    "protobuf>=4.21.0",
    "tqdm>=4.64.0",
    "python-snappy>=0.6.1",
    "PyYAML>=6.0",
    "Pillow>=10.0.0",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "ruff>=0.1.0", "pre-commit>=3.0.0"]

[project.urls]
Homepage = "https://github.com/psobot/keynote-parser"
"Bug Reports" = "https://github.com/psobot/keynote-parser/issues"
Source = "https://github.com/psobot/keynote-parser/"

[project.scripts]
keynote-parser = "keynote_parser.command_line:main"

[tool.setuptools]
packages = ["keynote_parser", "keynote_parser.generated"]

[tool.setuptools.package-data]
keynote_parser = ["generated/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=keynote_parser"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults
    "B904", # raise from
]
