# This workflows will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: Deploy Python Package

on:
  release:
    types: [created]

permissions: {}

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.13'
    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        enable-cache: false
        python-version: '3.13'
    - name: Set path
      run: echo "${PWD}/protoc/bin/" >> $GITHUB_PATH
    - name: Install dependencies
      run: |
        pip install protobuf>=4
        # protobuf 4 or later is necessary
        wget https://github.com/protocolbuffers/protobuf/releases/download/v21.9/protoc-21.9-linux-x86_64.zip
        unzip protoc-21.9-linux-x86_64.zip -d protoc
        sudo apt-get install -qq libsnappy-dev
        pip install -r requirements.txt
        python -m pip install --upgrade pip
        pip install setuptools wheel twine build 'protobuf>=3.20.0rc1,<4'
    - name: Build
      run: |
        # Build the gencode:
        uv run --script dumper/run.py
        # Build the package:
        python -m build
        # Upload the package:
        twine upload dist/*
    - name: Publish to PyPI via OIDC
      uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0