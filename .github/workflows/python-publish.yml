# This workflows will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: Deploy Python Package

on:
  release:
    types: [created]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        sudo apt-get install -qq libsnappy-dev
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install setuptools wheel twine build rich
    - name: Build and publish
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      run: |
        # Build the gencode. protoc is pinned and downloaded by dumper/run.py,
        # so the published wheel's generated code doesn't depend on whatever
        # protoc happens to be on the runner.
        PYTHONPATH=$PYTHONPATH:$(pwd) python3 dumper/run.py
        # Build the package:
        python -m build
        # Upload the package:
        twine upload dist/*
