# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: PyTest & Ruff

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set path
      run: echo "${PWD}/protoc/bin/" >> $GITHUB_PATH
    - name: Install dependencies
      run: |
        pip install protobuf>=4
        # protobuf 4 or later is necessary
        wget https://github.com/protocolbuffers/protobuf/releases/download/v21.9/protoc-21.9-linux-x86_64.zip
        unzip protoc-21.9-linux-x86_64.zip -d protoc
        sudo apt-get install -qq libsnappy-dev
        python -m pip install --upgrade pip
        pip install ruff pytest 'protobuf>=3.20.0rc1,<4'
        pip install -r requirements.txt
    - name: Build gencode
      run: uv run --script dumper/run.py
    - name: Lint with ruff
      run: ruff check .
    - name: Test with pytest
      run: PYTHONPATH=$PYTHONPATH:$(pwd) pytest
