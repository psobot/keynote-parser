# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: PyTest & Ruff

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsnappy-dev
        # Download specific protoc version needed for proto compilation
        wget https://github.com/protocolbuffers/protobuf/releases/download/v21.9/protoc-21.9-linux-x86_64.zip
        unzip protoc-21.9-linux-x86_64.zip -d protoc
        echo "$PWD/protoc/bin" >> $GITHUB_PATH
    
    - name: Install Python dependencies
      run: |
        uv pip install --system -e ".[dev]"
    
    - name: Build package (generate protobuf files)
      run: make all
    
    - name: Lint with Ruff
      run: |
        ruff check keynote_parser tests
    
    - name: Test with pytest
      run: |
        pytest --cov=keynote_parser
