# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: PyTest & Ruff

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -qq libsnappy-dev
    - name: Install protoc
      run: |
        wget https://github.com/protocolbuffers/protobuf/releases/download/v28.3/protoc-28.3-linux-x86_64.zip
        unzip protoc-28.3-linux-x86_64.zip -d protoc
        echo "$PWD/protoc/bin" >> $GITHUB_PATH
    - name: Install dependencies
      run: |
        uv pip install --system -e ".[dev]"
    - name: Build package
      run: make
    - name: Lint with ruff
      run: |
        ruff check . --exclude keynote_parser/generated
    - name: Format check with ruff
      run: |
        ruff format --check . --exclude keynote_parser/generated
    - name: Type check with pyright
      run: |
        uv pip install --system pyright
        pyright keynote_parser --ignore keynote_parser/generated
    - name: Test with pytest
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        pytest --cov=keynote_parser
